<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <!-- Row-1 -->
    <div class="main1">
      <div class="main">
        <div class="row-1">
          <div id="esc">esc</div>
          <div id="f1">f1</div>
          <div id="f2">f2</div>

          <div id="e">E</div>
          <div id="r">R</div>
          <div id="t">T</div>
          <div id="y">Y</div>

          <div id="o">O</div>
          <div id="p">P</div>
          <div id="brl">[</div>
          <div id="brr">]</div>
          <div id="backslash">\</div>

        <!-- Row-4 -->
        <div class="row-4">
          <div id="capslock">capslock</div>
          <div id="a">A</div>
          <div id="s">S</div>

          <div id="shift">shift</div>
          <div id="z">Z</div>
          <div id="x">X</div>
          <div id="c">C</div>
          <div id="v">V</div>

          <div id="n">N</div>
          <div id="m">M</div>
          <div id="comma">,</div>
          <div id="dot">.</div>

        <div class="row-6">
          <div id="ctrl">ctrl</div>
          <div id="fn">fn</div>
          <div id="win">win</div>
          <div id="alt">alt</div>
          <div id="space" class="sp">space</div>
          <div id="alt2">alt</div>
          <div id="control2">ctrl</div>
        </div>
